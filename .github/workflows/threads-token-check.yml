name: Threads token check

# Every Monday at 06:47 UTC (before the 08:00 posting slot), plus a manual
# "Run workflow" button. Checks that THREADS_ACCESS_TOKEN still works and,
# when a SECRETS_PAT secret is present, renews it for another 60 days.
# If the token stops working, it opens an issue on this repo (GitHub emails
# the owner). When the token works again, the issue is closed automatically.
on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the Threads token
        id: check
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: node threads-token-check.js

      - name: Save the renewed token
        if: steps.check.outputs.status == 'renewed'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          NEW_TOKEN: ${{ steps.check.outputs.new_token }}
        run: |
          printf '%s' "$NEW_TOKEN" | gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Saved the renewed token to THREADS_ACCESS_TOKEN."

      - name: Open or update the alert issue
        if: contains(fromJSON('["invalid","missing","failing"]'), steps.check.outputs.status)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          TITLE="Threads token needs attention"
          BODY=$(printf '%s\n\nHow to fix: developers.facebook.com, My Apps, your Threads app, Use cases, Access the Threads API, Settings, User Token Generator. Then paste the new token into this repo: Settings, Secrets and variables, Actions, THREADS_ACCESS_TOKEN.\n\nChecked %s.' "$SUMMARY" "$(date -u '+%d %b %Y %H:%M UTC')")
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Close the alert issue once fixed
        if: contains(fromJSON('["ok","renewed"]'), steps.check.outputs.status)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"Threads token needs attention\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "Fixed: $SUMMARY"; fi

      - name: Summary
        if: always()
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo "### Threads token: ${STATUS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
